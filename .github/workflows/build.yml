name: Build Farida Smart APK

on:
  push:
    branches:
      - main
      - build/farida-smart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp farida.png app/src/main/assets/farida.png
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp sw.js app/src/main/assets/sw.js
          cp Code.gs app/src/main/assets/Code.gs

      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/farida/nova/MainActivity.java
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/farida.png

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Farida-Smart-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
