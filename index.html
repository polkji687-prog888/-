<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="فريدة الذكية، مساعدتك العربية">
  <title>فريدة الذكية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #263244;
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #8b6b16);
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    .header-info h1 {
      margin: 0 0 5px;
      font-size: 19px;
    }

    .header-info p {
      margin: 0;
      color: #a7f3d0;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .bot {
      align-self: flex-start;
      background: #263449;
      border-bottom-right-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: #9b7b25;
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    #status {
      min-height: 22px;
      padding: 3px 14px;
      color: #fbbf24;
      font-size: 12px;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111827;
      border-top: 1px solid #263244;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 1px solid #475569;
      background: #1e293b;
      color: white;
      border-radius: 24px;
      padding: 13px 16px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      border: 0;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      background: #d4af37;
      color: #111827;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <header>
    <div class="avatar">ف</div>
    <div class="header-info">
      <h1>فريدة الذكية</h1>
      <p>متاحة للمحادثة الآن</p>
    </div>
  </header>

  <main id="chat">
    <div class="message bot">
      أهلًا بيك! أنا فريدة الذكية 🌷
      اكتبلي اللي محتاجه وأنا هحاول أساعدك.
    </div>
  </main>

  <div id="status"></div>

  <form id="form">
    <input
      id="message"
      type="text"
      placeholder="اكتب رسالتك هنا..."
      autocomplete="off"
      required
    >
    <button id="send" type="submit">➤</button>
  </form>

  <script>
    (() => {
      const API_URL = "https://script.google.com/macros/s/AKfycbxqO_ZAhmeBWAd6c12-UyE1qNNT3_hdJ3aRap4RLjxsaoOMRIaB9MrZmxajv_JTHfTMoA/exec";

      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("message");
      const send = document.getElementById("send");
      const status = document.getElementById("status");

      function addMessage(text, type) {
        const bubble = document.createElement("div");
        bubble.className = "message " + type;
        bubble.textContent = text;
        chat.appendChild(bubble);
        chat.scrollTop = chat.scrollHeight;
      }

      function askFarida(message) {
        return new Promise((resolve, reject) => {
          const callbackName =
            "faridaCallback_" + Date.now() + "_" +
            Math.floor(Math.random() * 100000);

          const script = document.createElement("script");
          let finished = false;

          const cleanup = () => {
            delete window[callbackName];
            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }
          };

          const timer = setTimeout(() => {
            if (finished) return;
            finished = true;
            cleanup();
            reject(new Error("انتهت مهلة الاتصال بالخدمة."));
          }, 45000);

          window[callbackName] = (data) => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            cleanup();

            if (data && data.success && data.reply) {
              resolve(data.reply);
            } else {
              reject(new Error(
                data && data.reply
                  ? data.reply
                  : "الخدمة لم ترسل ردًا صحيحًا."
              ));
            }
          };

          script.onerror = () => {
            if (finished) return;
            finished = true;
            clearTimeout(timer);
            cleanup();
            reject(new Error("تعذر الاتصال بالخدمة. تأكد من الإنترنت."));
          };

          const separator = API_URL.includes("?") ? "&" : "?";

          script.src =
            API_URL +
            separator +
            "message=" + encodeURIComponent(message) +
            "&callback=" + encodeURIComponent(callbackName);

          document.body.appendChild(script);
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        addMessage(message, "user");
        input.value = "";
        input.disabled = true;
        send.disabled = true;
        status.textContent = "فريدة بتفكر في الرد...";

        try {
          const reply = await askFarida(message);
          addMessage(reply, "bot");
          status.textContent = "";
        } catch (error) {
          addMessage("حصلت مشكلة: " + error.message, "bot");
          status.textContent = "تعذر الحصول على رد.";
        } finally {
          input.disabled = false;
          send.disabled = false;
          input.focus();
        }
      });
    })();
  </script>

</body>
</html>
