<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101020">
<title>فريدة الذكية</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#171b31;--panel2:#202642;--line:#353653;--gold:#e8c783;--purple:#a58be8;--text:#f8f5ff;--muted:#b5b0c8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#292044 0,#101020 55%,#090c17 100%);color:var(--text);font-family:system-ui,Tahoma,Arial,sans-serif;min-height:100vh}
.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:12px}
header{display:flex;align-items:center;gap:12px;padding:10px 4px 14px;border-bottom:1px solid var(--line)}
.avatar{width:54px;height:54px;border-radius:18px;object-fit:cover;object-position:center 20%;border:2px solid var(--gold);box-shadow:0 0 20px #a58be855}
h1{font-size:19px;margin:0}header p{font-size:12px;color:var(--muted);margin:3px 0 0}.spacer{flex:1}
button{font:inherit;cursor:pointer}.small{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px}
#chat{flex:1;display:flex;flex-direction:column;gap:12px;padding:16px 0;overflow:auto}
.welcome{text-align:center;margin:auto 0;padding:18px 10px;color:var(--muted)}
.hero{width:min(76vw,270px);height:290px;object-fit:cover;object-position:center 18%;border-radius:26px;border:1px solid #8069ae;box-shadow:0 16px 45px #0008}
.welcome h2{color:var(--gold);margin:12px 0 6px}.welcome p{margin:4px 0 14px}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.pill{background:#28223d;border:1px solid #594c78;color:#eee4ff;border-radius:22px;padding:9px 14px}
.msg{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-start;background:#303b60;border-bottom-right-radius:5px}.bot{align-self:flex-end;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.status{font-size:11px;color:var(--muted);padding:6px 3px}.error{color:#ffaaa8}
.composer{display:flex;align-items:flex-end;gap:8px;background:#171b31;border:1px solid var(--line);border-radius:20px;padding:9px;position:sticky;bottom:6px;box-shadow:0 12px 36px #0007}
textarea{flex:1;min-width:0;resize:none;max-height:130px;min-height:44px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px}
.send{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:linear-gradient(135deg,#f0d99f,#bd9455);color:#191526}
.icon{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:white;font-size:18px}
.hint{text-align:center;color:var(--muted);font-size:11px;padding:9px}
#photoView{display:none;position:fixed;inset:0;background:#080914ed;z-index:5;align-items:center;justify-content:center;flex-direction:column;padding:20px}
#photoView img{width:min(88vw,390px);max-height:75vh;object-fit:contain;border-radius:24px;border:1px solid var(--gold)}
#photoView button{margin-top:16px}
@media(max-width:520px){.app{padding:9px}.msg{max-width:95%}}
</style>
</head>
<body>
<div class="app">
<header>
<img class="avatar" src="farida.png" alt="فريدة">
<div><h1>فريدة الذكية 💜</h1><p>موجودة معاكي... وبمزاج مش دايمًا هادي 😏</p></div>
<div class="spacer"></div><button class="small" id="newChat">＋ جديد</button>
</header>
<main id="chat" aria-live="polite">
<section class="welcome" id="welcome">
<img class="hero" src="farida.png" alt="الصورة الأساسية الثابتة لفريدة">
<h2>أنا فريدة 💜</h2><p>اتأخرت عليا ليه؟ كنت مستنياك... مش أوي يعني 😂</p>
<div class="actions"><button class="pill" id="showPhoto">عاوز تشوفيني؟ 📸</button><button class="pill" id="hello">قولي حاجة يا فريدة 😏</button></div>
</section>
</main>
<div class="status" id="status">جاهزة للكلام</div>
<form class="composer" id="form">
<button type="button" class="icon" id="voice" title="إملاء صوتي">🎙️</button>
<textarea id="message" rows="1" placeholder="اكتب لفريدة..." autocomplete="off"></textarea>
<button class="send" id="send" type="submit">إرسال</button>
</form>
<div class="hint">فريدة بتتكلم معاك باللهجة المصرية. الردود الذكية تحتاج اتصالًا بالإنترنت.</div>
</div>
<div id="photoView" role="dialog" aria-label="صورة فريدة"><img src="farida.png" alt="فريدة بملامحها الأساسية الثابتة"><button class="small" id="closePhoto">إغلاق</button></div>
<script>
(() => {
const chat=document.getElementById("chat"),form=document.getElementById("form"),input=document.getElementById("message"),status=document.getElementById("status"),send=document.getElementById("send");
let history=[];try{history=JSON.parse(localStorage.getItem("farida_history")||"[]")}catch{history=[]}
function setStatus(t,bad=false){status.textContent=t;status.className="status"+(bad?" error":"")}
function addMessage(text,who,save=true){document.getElementById("welcome")?.remove();const d=document.createElement("div");d.className="msg "+(who==="user"?"user":"bot");d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;if(save){history.push({text,who});history=history.slice(-80);try{localStorage.setItem("farida_history",JSON.stringify(history))}catch{}}}
history.forEach(m=>{if(m.text)addMessage(m.text,m.who,false)});
document.getElementById("showPhoto").onclick=()=>document.getElementById("photoView").style.display="flex";
document.getElementById("closePhoto").onclick=()=>document.getElementById("photoView").style.display="none";
document.getElementById("hello").onclick=()=>{input.value="قولي حاجة يا فريدة";form.requestSubmit()};
document.getElementById("newChat").onclick=()=>{if(!confirm("نبدأ صفحة جديدة؟"))return;history=[];localStorage.removeItem("farida_history");chat.innerHTML='<section class="welcome" id="welcome"><img class="hero" src="farida.png" alt="فريدة"><h2>رجعتلك تاني 💜</h2><p>يلا، احكيلي بقى.</p><div class="actions"><button class="pill" id="showPhoto">عاوز تشوفيني؟ 📸</button></div></section>';document.getElementById("showPhoto").onclick=()=>document.getElementById("photoView").style.display="flex";setStatus("محادثة جديدة")};
form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;addMessage(text,"user");input.value="";input.style.height="44px";if(!window.FaridaAndroid||typeof window.FaridaAndroid.askFarida!=="function"){addMessage("الرسالة وصلت للشات، لكن اتصال أندرويد غير موجود في النسخة المفتوحة. ثبّت نسخة التطبيق المبنية من جديد.","bot");setStatus("تعذر الاتصال بجسر أندرويد.",true);return}send.disabled=true;setStatus("فريدة بتفكر...");const typing=document.createElement("div");typing.className="msg bot";typing.textContent="ثواني، بفكر في رد يليق بيك 😏";chat.appendChild(typing);const callback="faridaReply_"+Date.now()+"_"+Math.floor(Math.random()*100000);let done=false;const timeout=setTimeout(()=>{finish();addMessage("الخدمة اتأخرت ومفيش رد وصل. جرّب تبعت الرسالة تاني بعد التأكد من الإنترنت.","bot");setStatus("انتهت مهلة الاتصال.",true)},90000);const finish=()=>{if(done)return;done=true;clearTimeout(timeout);typing.remove();send.disabled=false;delete window[callback]};window[callback]=data=>{finish();if(!data||data.success!==true){addMessage("فيه مشكلة حصلت: "+(data&&data.reply?data.reply:"الخدمة مردتش بشكل مفهوم."),"bot");setStatus("تحقق من الاتصال.",true);return}addMessage(data.reply||"لساني وقف لحظة، جرب تاني 😂","bot");setStatus("فريدة معاك")};try{window.FaridaAndroid.askFarida(text,callback)}catch(err){finish();addMessage("حصل خطأ في الاتصال: "+(err&&err.message?err.message:"خطأ غير معروف"),"bot");setStatus("تعذر الاتصال.",true)}});
input.addEventListener("input",()=>{input.style.height="44px";input.style.height=Math.min(input.scrollHeight,130)+"px"});
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
document.getElementById("voice").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){setStatus("الإملاء الصوتي غير مدعوم هنا.",true);return}const rec=new SR();rec.lang="ar-EG";rec.onresult=e=>{input.value+=(input.value?" ":"")+e.results[0][0].transcript;input.dispatchEvent(new Event("input"))};rec.onerror=()=>setStatus("الصوت مش واضح، جرب تاني.",true);rec.start();setStatus("سامعاك... اتكلم")};
})();
</script>
</body></html>
