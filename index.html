
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="فريدة الذكية، مساعدتك العربية">
<title>فريدة الذكية</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b1220;
  color:#fff;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
#splash{
  position:fixed;inset:0;z-index:10;
  background:linear-gradient(145deg,#101827,#17243a);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .5s;
}
#splash img{
  width:145px;height:145px;
  object-fit:cover;border-radius:50%;
  border:3px solid #d4af37;
  box-shadow:0 0 35px #d4af3755;
}
#splash h1{color:#e6c45a;margin:20px 0 8px}
#splash p{color:#b8c1d1;font-size:14px}
header{
  padding:12px 16px;
  background:#111c2e;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid #29364a;
}
.avatar{
  width:48px;height:48px;
  border-radius:50%;object-fit:cover;
  border:2px solid #d4af37;
  background:#263449;
}
.header-info{flex:1}
.header-info h1{font-size:18px;margin:0 0 5px}
.header-info p{font-size:12px;margin:0;color:#a7f3d0}
.online{
  width:9px;height:9px;border-radius:50%;
  background:#35d399;display:inline-block;
  margin-left:5px;
}
#chat{
  flex:1;overflow-y:auto;
  padding:16px;display:flex;
  flex-direction:column;gap:13px;
  scroll-behavior:smooth;
}
.message{
  max-width:88%;padding:12px 15px;
  border-radius:17px;line-height:1.8;
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:15px;
}
.bot{
  align-self:flex-start;background:#263449;
  border-bottom-right-radius:4px;
}
.user{
  align-self:flex-end;background:#927326;
  border-bottom-left-radius:4px;
}
.welcome{
  display:flex;align-items:center;gap:10px;
  margin-bottom:5px;
}
.welcome img{
  width:38px;height:38px;border-radius:50%;
  object-fit:cover;border:1px solid #d4af37;
}
#status{
  min-height:23px;padding:3px 15px;
  color:#e6c45a;font-size:12px;
}
form{
  display:flex;gap:9px;padding:12px;
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  background:#111c2e;border-top:1px solid #29364a;
}
input{
  flex:1;min-width:0;
  border:1px solid #46546a;
  background:#1e293b;color:#fff;
  border-radius:25px;padding:13px 16px;
  font-size:15px;outline:none;
}
input:focus{border-color:#d4af37}
button{
  border:0;border-radius:50%;
  width:48px;height:48px;
  background:#d4af37;color:#101827;
  font-size:21px;font-weight:bold;
}
button:disabled,input:disabled{opacity:.55}
.footer{
  text-align:center;font-size:10px;
  color:#778399;padding:4px 0 7px;
  background:#111c2e;
}
</style>
</head>

<body>

<div id="splash">
  <img src="farida.png" alt="فريدة"
       onerror="this.style.display='none'">
  <h1>فريدة الذكية</h1>
  <p>مساعدتك الذكية في كل وقت 🌷</p>
</div>

<header>
  <img class="avatar" src="farida.png" alt="فريدة"
       onerror="this.style.display='none'">
  <div class="header-info">
    <h1>فريدة الذكية</h1>
    <p><span class="online"></span>متاحة للمحادثة الآن</p>
  </div>
</header>

<main id="chat">
  <div class="message bot">
    <div class="welcome">
      <img src="farida.png" alt=""
           onerror="this.style.display='none'">
      <strong>أهلًا بيك، أنا فريدة 🌷</strong>
    </div>
    أنا مساعدتك الذكية. اسألني عن أي حاجة، وأنا هحاول أساعدك بأفضل إجابة.
  </div>
</main>

<div id="status"></div>

<form id="form">
  <input id="message" type="text"
    placeholder="اكتب رسالتك هنا..."
    autocomplete="off" required>
  <button id="send" type="submit">➤</button>
</form>
<div class="footer">فريدة الذكية © 2026</div>

<script>
(() => {
  const API_URL = "https://script.google.com/macros/s/AKfycbxqO_ZAhmeBWAd6c12-UyE1qNNT3_hdJ3aRap4RLjxsaoOMRIaB9MrZmxajv_JTHfTMoA/exec";

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  const status = document.getElementById("status");

  setTimeout(() => {
    const splash = document.getElementById("splash");
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 550);
  }, 1800);

  function addMessage(text, type) {
    const bubble = document.createElement("div");
    bubble.className = "message " + type;
    bubble.textContent = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  }

  function askFarida(message) {
    return new Promise((resolve, reject) => {
      const callbackName =
        "faridaCallback_" + Date.now() + "_" +
        Math.floor(Math.random() * 1000000);

      const script = document.createElement("script");
      script.async = true;
      let finished = false;

      function cleanup() {
        clearTimeout(timer);
        delete window[callbackName];
        script.onerror = null;
        script.onload = null;
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      function fail(message) {
        if (finished) return;
        finished = true;
        cleanup();
        reject(new Error(message));
      }

      const timer = setTimeout(() => {
        fail("انتهت مهلة الاتصال. لم يصل رد من الخدمة خلال 60 ثانية.");
      }, 60000);

      window[callbackName] = (data) => {
        if (finished) return;
        finished = true;
        cleanup();

        if (data && data.success && data.reply) {
          resolve(data.reply);
        } else {
          reject(new Error(
            data && data.reply
              ? data.reply
              : "وصل رد غير مفهوم من الخدمة."
          ));
        }
      };

      // اختبار تحميل الخدمة وتنفيذ رد فريدة
      script.onload = () => {
        if (finished) return;

        setTimeout(() => {
          if (!finished) {
            fail("تم تحميل الخدمة لكن لم يتم تنفيذ رد فريدة. قد تكون المشكلة في إعادة توجيه Google أو طريقة الاتصال داخل التطبيق.");
          }
        }, 1500);
      };

      script.onerror = () => {
        fail("تعذر تحميل الخدمة. تحقق من الإنترنت أو من الاتصال بخدمة Google.");
      };

      const separator = API_URL.includes("?") ? "&" : "?";

      script.src =
        API_URL + separator +
        "message=" + encodeURIComponent(message) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();

      document.body.appendChild(script);
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";
    input.disabled = true;
    send.disabled = true;
    status.textContent = "فريدة بتفكر في الرد...";

    try {
      const reply = await askFarida(message);
      addMessage(reply, "bot");
      status.textContent = "";
    } catch (error) {
      addMessage("حصلت مشكلة: " + error.message, "bot");
      status.textContent = "تعذر الحصول على رد.";
    } finally {
      input.disabled = false;
      send.disabled = false;
      input.focus();
    }
  });
})();
</script>

</body>
</html>
